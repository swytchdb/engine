name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test $(go list ./... | grep -v /sql)

      - name: go test (race)
        run: go test -race $(go list ./... | grep -v /sql)
